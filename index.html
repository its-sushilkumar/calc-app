<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utility Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f051d;
      --panel-bg: #1b0e33;
      --card-bg: #2a164d;
      --text-main: #f3e8ff;
      --text-muted: #a78bfa;
      --accent: #38bdf8;
      --btn-hover: #4c1d95;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Press Start 2P', monospace;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .calculator-container {
      background: var(--panel-bg);
      border: 4px solid var(--text-main);
      box-shadow: 6px 6px 0px #000;
      padding: 1.5rem;
      max-width: 340px;
      width: 100%;
    }

    .calc-header {
      font-size: 0.6rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
    }

    .display {
      background: #000;
      border: 3px solid var(--accent);
      color: var(--accent);
      font-size: 1rem;
      padding: 1rem;
      text-align: right;
      margin-bottom: 1.2rem;
      word-break: break-all;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    button {
      background: var(--card-bg);
      color: var(--text-main);
      border: 2px solid var(--text-main);
      padding: 14px 0;
      font-size: 0.7rem;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000;
      transition: background 0.1s;
    }

    button:hover {
      background: var(--btn-hover);
    }

    button:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px #000;
    }

    .btn-operator {
      color: var(--accent);
      border-color: var(--accent);
    }

    .btn-clear {
      color: var(--danger);
      border-color: var(--danger);
    }

    .btn-equals {
      background: var(--accent);
      color: #000;
      grid-column: span 2;
    }

    .back-link {
      display: inline-block;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.5rem;
      margin-top: 1.5rem;
      text-align: center;
      width: 100%;
    }

    .back-link:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="calculator-container">
    <div class="calc-header">
      <span>CALC v1.0</span>
      <span>STANDARD</span>
    </div>

    <div id="display" class="display">0</div>

    <div class="buttons-grid">
      <button class="btn-clear" onclick="clearDisplay()">C</button>
      <button onclick="appendValue('/')" class="btn-operator">/</button>
      <button onclick="appendValue('*')" class="btn-operator">*</button>
      <button onclick="deleteChar()">⌫</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button onclick="appendValue('-')" class="btn-operator">-</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button onclick="appendValue('+')" class="btn-operator">+</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button onclick="calculate()" class="btn-equals" style="grid-row: span 2; height: 100%;">=</button>

      <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
      <button onclick="appendValue('.')">.</button>
    </div>

    <a href="https://home-page-sushil.vercel.app" class="back-link">◀ RETURN TO PORTFOLIO</a>
  </div>

  <script>
    const display = document.getElementById('display');
    let currentInput = '0';

    function updateDisplay() {
      display.innerText = currentInput;
    }

    function appendValue(val) {
      if (currentInput === '0' && val !== '.') {
        currentInput = val;
      } else {
        currentInput += val;
      }
      updateDisplay();
    }

    function clearDisplay() {
      currentInput = '0';
      updateDisplay();
    }

    function deleteChar() {
      if (currentInput.length > 1) {
        currentInput = currentInput.slice(0, -1);
      } else {
        currentInput = '0';
      }
      updateDisplay();
    }

    function calculate() {
      try {
        // Safe evaluation for standard utility math
        currentInput = String(eval(currentInput));
      } catch (error) {
        currentInput = 'ERROR';
      }
      updateDisplay();
    }
  </script>

</body>
</html>
